name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build all tools (${{ matrix.goos }}/${{ matrix.goarch }})
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          ext=""
          [ "${{ matrix.goos }}" = "windows" ] && ext=".exe"

          mkdir -p dist/tools
          for dir in ./cmd/*/; do
            tool=$(basename "$dir")
            if [ "$tool" = "srxfixup" ]; then
              go build -ldflags="-s -w" -o "dist/tools/$tool$ext" "$dir"
            else
              go build -o "dist/tools/$tool$ext" "$dir"
            fi
          done

          for alias in eefixup erx-strip iopfixup irx-strip; do
            cp "dist/tools/srxfixup$ext" "dist/tools/$alias$ext"
          done

      - name: Bundle licenses
        run: cp -r licenses/tools dist/tools/licenses

      - name: Package
        run: |
          cd dist
          zip -r "../tools-${GITHUB_REF_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}.zip" tools

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.goos }}-${{ matrix.goarch }}
          path: tools-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          fail_on_unmatched_files: true
